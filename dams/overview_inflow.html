<!--
  The inflow twin of dam_html_overview.html. That map ranks dams by 24-hour
  RAINFALL against fixed depths; this one ranks the hydrograph against each
  dam's OWN 2/5/20-year flood. They disagree on ~42% of dams in a typical
  cycle and are not measuring the same thing: 50 mm of rain is common, a
  2-year flood is not.

  NO RELIABILITY ANYWHERE ON THIS PAGE (owner, 2026-09-24). The markers used
  to carry a shape encoding for "evaluated against a gauge", with a legend, a
  table column, a toggle and a banner; all of it came off together with the
  KGE/NSE/PBIAS scores on the dam pages. One marker is one dam: colour is the
  warning level, size is the catchment.
-->

                      border-radius:6px;background:#fff;color:var(--ink)}
  button{cursor:pointer}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;
         margin-bottom:14px}
  .tile{border:1px solid var(--line);border-left-width:6px;border-radius:8px;padding:9px 12px;
        background:#fbfdff;cursor:pointer;user-select:none}
  .tile.off{opacity:.4}
  .tile .n{font-size:23px;font-weight:700;line-height:1.15}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12px;color:var(--mut);

  .legsep{width:100%;height:0;margin:2px 0}
  table{border-collapse:collapse;width:100%;background:#fff;font-size:13.5px}
  th,td{padding:7px 10px;border-bottom:1px solid #eef3f7;text-align:left;white-space:nowrap}
  th{background:#eef4f9;cursor:pointer;position:sticky;top:0;font-weight:600;z-index:2}
  tr:hover td{background:#f7fbff}
  td.num,th.num{text-align:right}
  a{color:var(--accent);text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;
        color:#fff;font-weight:600}
  .note{color:var(--mut);font-size:12.5px;margin-top:8px}
  .tip{position:fixed;pointer-events:none;background:#12324d;color:#fff;font-size:12px;
       padding:6px 9px;border-radius:5px;opacity:0;transition:opacity .1s;z-index:9;
       white-space:pre;max-width:320px}
  .credit{margin-top:22px;padding:14px 16px;background:#fff;border:1px solid var(--line);

  return stopColor(r[m], Q_STOPS);
}

/* ------------------------------- filter state ------------------------------- */
const lvOn = {0:true,1:true,2:true,3:true};
const uniq = k => [...new Set(ROWS.map(r=>r[k]).filter(Boolean))]
  .sort((a,b)=>String(a).localeCompare(String(b),"vi"));
uniq("province").forEach(v => $("#prov").add(new Option(v,v)));
uniq("basin").forEach(v => $("#basin").add(new Option(v,v)));

function visible(){
  const q = norm($("#q").value.trim()), pv=$("#prov").value, bs=$("#basin").value;
  return ROWS.filter(r => lvOn[r.hlvl||0] &&
    (!pv || r.province===pv) && (!bs || r.basin===bs) &&
    (!q || norm([r.name,r.name_en,r.province,r.commune,r.river,r.basin].join(" ")).includes(q)));
}

/* --------------------------------- tooltip --------------------------------- */
const tip = $("#tip");
const showTip = (e,t) => { tip.textContent=t; tip.style.opacity=1;
  tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY+14)+"px"; };
const hideTip = () => tip.style.opacity = 0;
function tipText(r){
  return r.name + (r.province ? " — "+r.province : "") + "\n" +
    "Mức: " + byLv(r.hlvl).lab + "\n" +
    "Đỉnh dòng chảy đến p50: " + fq(r.hq50) + " m³/s  (p90 " + fq(r.hq90) + ")\n" +
    "Xác suất đỉnh vượt ngưỡng 2 năm: " + (r.hpp2==null?"—":r.hpp2+"%") + "\n" +
    (r.hsmall ? "Lưu vực rất nhỏ, số liệu không chính xác\n" : "") +
    "Mưa 24h q50: " + num(r.q50,1) + " mm\n" +
    "Bấm để mở trang chi tiết";
}

/* ----------------------------------- map ----------------------------------- */
const BB = (() => {
  if (PX) return [0,0,0,0];
  let w=180,s=90,e=-180,n=-90;
  ROWS.forEach(r => { w=Math.min(w,r.lon); e=Math.max(e,r.lon);
                      s=Math.min(s,r.lat); n=Math.max(n,r.lat); });
  return [w-0.6, s-0.6, e+0.6, n+0.6];
})();
const MW = 760, PAD = {l:40,r:14,t:10,b:32};
function proj(){
  if (PX) return {H:PX.H, x:v=>v, y:v=>v};
  const kx = Math.cos((BB[1]+BB[3])/2*Math.PI/180);
  const scale = (MW-PAD.l-PAD.r)/((BB[2]-BB[0])*kx);
  return {H:(BB[3]-BB[1])*scale + PAD.t + PAD.b,
          x:lo=>PAD.l+(lo-BB[0])*kx*scale, y:la=>PAD.t+(BB[3]-la)*scale};
}
const RX = r => PX ? r.px : null, RY = r => PX ? r.py : null;
// Public rows carry no `area_km2` (it is an exact figure and the public
// build publishes none), so the size control only exists when the rows can
// answer it. HAS_AREA is what every other piece of size UI keys off.
const HAS_AREA = ROWS.some(r => r.area_km2 != null);
if (!HAS_AREA){
  const lab = $("#size") && $("#size").closest("label");
  if (lab) lab.remove();
}
function radius(r){
  if (!HAS_AREA || !$("#size").checked) return 4.6;
  const a = r.area_km2 || 1;
  return Math.max(3, Math.min(15, 2.2 + 2.05*Math.log10(a+1)));
}

/* One marker: fill is the metric colour, radius is the catchment. */
function marker(r, cx, cy){
  return el("circle",{cx:cx, cy:cy, r:radius(r), fill:colorOf(r), "fill-opacity":.9,
    stroke:"#20313f", "stroke-width":1.1, style:"cursor:pointer"});
}

function drawMap(){
  const svg = $("#map"); svg.innerHTML = "";
  const pr = proj();
  svg.setAttribute("viewBox","0 0 "+MW+" "+pr.H);
  svg.setAttribute("width",MW); svg.setAttribute("height",pr.H);
  svg.style.height = "auto";

  const gp = el("g");
  PROV.forEach(ring => {
    const d = "M"+ring.map(p=>pr.x(p[0]).toFixed(1)+","+pr.y(p[1]).toFixed(1)).join("L")+"Z";
    gp.appendChild(el("path",{d:d, fill:"#e9f0f6", stroke:"#c2d2df", "stroke-width":.7}));
  });
  svg.appendChild(gp);

  // calm first, so the dams that matter end up on top
  const rows = visible().slice().sort((a,b) =>
    ((a.hlvl||0)-(b.hlvl||0)) || ((a.hpp2||0)-(b.hpp2||0)));
  const gd = el("g");
  rows.forEach(r => {
    const a = el("a", {href:r.file});
    const c = marker(r, (PX ? RX(r) : pr.x(r.lon)).toFixed(1),
                        (PX ? RY(r) : pr.y(r.lat)).toFixed(1));
    c.addEventListener("mousemove", e => showTip(e, tipText(r)));
    c.addEventListener("mouseleave", hideTip);
    a.appendChild(c); gd.appendChild(a);
  });
  svg.appendChild(gd);

  $("#mnote").textContent = rows.length + " / " + ROWS.length +
    " hồ đập đang hiển thị. Bấm vào một chấm để mở trang chi tiết.";
}

/* --------------------------------- legend ---------------------------------- */
function drawLegend(){
  const m = $("#metric").value;
  let items;
  if (m==="hlvl") items = LV.slice().reverse().map(l => [l.col, l.lab]);
  else if (m==="hpp2")
    items = [["#8e1b1b","≥ 70%"],["#e2412e","40–70%"],["#f29d1a","20–40%"],
             ["#7fcdbb","5–20%"],["#c9d6e0","< 5%"]];
  else
    items = [["#8e1b1b","≥ 500 m³/s"],["#e2412e","100–500"],["#f29d1a","20–100"],
             ["#7fcdbb","2–20"],["#c9d6e0","< 2"]];
  $("#leg").innerHTML =
    '<span style="font-weight:600;color:#12324d">Màu = mức:</span>' +
    items.map(([c,l]) => '<span><i style="background:'+c+'"></i>'+esc(l)+"</span>").join("") +
    (HAS_AREA && $("#size").checked ? '<span style="margin-left:6px">Cỡ chấm ∝ log(diện tích lưu vực)</span>' : "");
}

/* ---------------------------------- tiles ---------------------------------- */
function drawTiles(){
  const cnt = {0:0,1:0,2:0,3:0};
  ROWS.forEach(r => cnt[r.hlvl||0]++);
  $("#tiles").innerHTML = LV.slice().sort((a,b)=>b.rank-a.rank).map(l =>
    '<div class="tile'+(lvOn[l.rank]?"":" off")+'" data-rank="'+l.rank+
    '" style="border-left-color:'+l.col+'">'+
    '<div class="n" style="color:'+l.col+'">'+cnt[l.rank]+"</div>"+
    '<div class="l">'+esc(l.lab)+"</div></div>").join("");
  $("#tiles").querySelectorAll(".tile").forEach(t => t.onclick = () => {
    const k = +t.dataset.rank; lvOn[k] = !lvOn[k]; refresh(); });
}

/* ---------------------------------- table ---------------------------------- */
let sortK = "hlvl", sortDir = -1;
function drawTable(){
  const rows = visible().slice().sort((a,b) => {
    const x=a[sortK], y=b[sortK];
    let c;
    if (typeof x === "number" || typeof y === "number")
      c = ((x==null?-1e9:x)-(y==null?-1e9:y));
    else c = String(x==null?"":x).localeCompare(String(y==null?"":y),"vi");
    if (c === 0 && sortK !== "hpp2") c = ((a.hpp2||0)-(b.hpp2||0));
    return c*sortDir;
  });
  $("#tb").innerHTML = rows.map(r => {
    const l = byLv(r.hlvl);
    return "<tr>"+
      '<td><span class="pill" style="background:'+l.col+'">'+esc(l.lab)+"</span></td>"+
      "<td><a href='"+esc(r.file)+"'>"+esc(r.name)+"</a></td>"+
      "<td>"+esc(r.province)+"</td><td>"+esc(r.river)+"</td><td>"+esc(r.basin)+"</td>"+
      "<td class='num'>"+fq(r.hq50)+"</td><td class='num'>"+fq(r.hq90)+"</td>"+
      "<td class='num'>"+(r.hpp2==null?"—":r.hpp2+"%")+"</td>"+
      "<td class='num'>"+num(r.q50,1)+"</td>"+
      "<td class='num'>"+(r.area_km2==null?"—":num(r.area_km2,1))+"</td></tr>";
  }).join("");
  $("#tnote").innerHTML = rows.length + " hồ đập. Mức lấy theo <b>đỉnh dòng chảy đến " +
    "dự báo (p50)</b> so với ngưỡng lũ 2 / 5 / 20 năm tính từ chuỗi mô phỏng 2016–2025 " +
    "<b>của chính hồ đó</b> — khác với bản đồ theo mưa, vốn so với ngưỡng lượng mưa cố định. " +
    "Bấm tiêu đề cột để sắp xếp lại.";
}
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  sortDir = (k===sortK) ? -sortDir : (["name","province","river","basin"].includes(k) ? 1 : -1);
  sortK = k; drawTable();
});

/* --------------------------------- refresh --------------------------------- */
function refresh(){ drawTiles(); drawMap(); drawLegend(); }
["metric","prov","basin","size"].forEach(id => { const el = $("#"+id); if (el) el.onchange = refresh; });
$("#q").oninput = refresh;
refresh();
</script>
</body>
</html>
