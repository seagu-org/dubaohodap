<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dự báo mưa tổ hợp đến hồ đập</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root{--bg:#fff;--fg:#16202b;--muted:#6b7a8c;--line:#dfe6ee;
    --panel:rgba(255,255,255,.96);--accent:#1f6fb2;--shadow:0 2px 12px rgba(16,32,48,.18);}
  *{box-sizing:border-box;}
  html,body,#root{height:100%;margin:0;}
  body{font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;color:var(--fg);background:var(--bg);overflow:hidden;}
  #map{position:absolute;inset:0;z-index:0;background:#eef2f6;}
  .leaflet-container{font:inherit;}
  .island-label{font:400 12px/1.15 'Segoe UI',Roboto,Arial,sans-serif;color:#2a3a4a;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;text-align:center;letter-spacing:.2px;}
  /* Show the raster as EXACT 0.25 deg grid cells: the tile PNG is ~5 px/cell,
     and Leaflet's default smooth upscaling blurs the cell edges into a
     higher-res-looking smear. Nearest-neighbour keeps each cell a crisp
     square = faithful to the grid data. */
  .leaflet-raster-pane img{image-rendering:pixelated;image-rendering:crisp-edges;}
  .card{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .float{position:absolute;z-index:500;}
  .topleft{top:12px;left:12px;width:344px;max-width:calc(100vw - 24px);
    max-height:calc(100vh - 104px);overflow-y:auto;overflow-x:hidden;padding-right:4px;scrollbar-width:thin;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .brand{padding:11px 13px;position:relative;padding-right:46px;}
  /* Collapse control. The panel is full-width on a phone and would otherwise
     cover the map, so it starts collapsed there (see panelOpen) and the whole
     stack below the title hides. */
  .ptoggle{position:absolute;top:8px;right:8px;width:30px;height:30px;
    border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;
    color:var(--muted);font-size:13px;line-height:1;display:flex;
    align-items:center;justify-content:center;padding:0;}
  .ptoggle:hover{border-color:var(--accent);color:var(--accent);}
  .ptoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .stack.collapsed > *:not(.brand){display:none;}
  .topleft.collapsed{max-height:none;overflow:visible;}
  .brand h1{margin:0;font-size:15px;font-weight:800;}
  .brand .sub{color:var(--muted);font-size:11.5px;margin-top:3px;}
  .searchbox{position:relative;}
  .searchbox input{width:100%;padding:11px 13px;border:0;border-radius:10px;font:inherit;outline:none;background:transparent;color:var(--fg);}
  .results{position:absolute;top:100%;left:0;right:0;margin-top:6px;max-height:340px;overflow-y:auto;z-index:10;}
  .results button{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:0;
    border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer;}
  .results button:hover{background:#eef5fb;}
  .results .sub{color:var(--muted);font-size:12px;}
  .pad{padding:11px 13px;}
  .title{font-weight:700;font-size:13px;margin:0 0 8px;}
  .hint{color:var(--muted);font-size:11.5px;line-height:1.4;}
  .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:0 0 5px;}
  .seg{display:flex;gap:4px;flex-wrap:wrap;}
  .seg button{flex:1 1 auto;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:#fff;
    font:inherit;font-size:12.5px;cursor:pointer;color:var(--fg);white-space:nowrap;}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .seg button:disabled{opacity:.4;cursor:default;}
  .seg.mdl button.on{background:var(--mc,#37474f);border-color:var(--mc,#37474f);color:var(--mct,#fff);}
  .legend-row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12.5px;}
  .swatch{width:15px;height:15px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.16);}
  .timeline{position:absolute;left:0;right:0;bottom:0;z-index:500;background:#1c2530;color:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.28);}
  .tl-inner{display:flex;align-items:stretch;}
  .tl-play{flex:0 0 auto;width:56px;border:0;background:#2b3746;color:#ffd54a;font-size:19px;cursor:pointer;border-right:1px solid #3a4757;}
  .tl-play:hover{background:#35435a;}
  .tl-days{flex:1 1 auto;display:flex;overflow-x:auto;}
  .tl-day{flex:1 0 108px;border:0;border-right:1px solid #2f3a49;background:transparent;color:#b9c6d4;
    font:inherit;padding:8px 4px 10px;cursor:pointer;text-align:center;position:relative;}
  .tl-day:hover{background:#26313e;}
  .tl-day.on{color:#ffd54a;font-weight:700;}
  .tl-day.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffd54a;}
  .tl-dow{font-size:13px;}
  .tl-date{font-size:11px;opacity:.85;}
  .drawer{position:absolute;top:0;right:0;bottom:0;width:494px;max-width:100vw;z-index:900;background:#fff;
    border-left:1px solid var(--line);box-shadow:-3px 0 16px rgba(16,32,48,.16);display:flex;flex-direction:column;}
  .drawer header{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;}
  .drawer header h2{margin:0;font-size:18px;}
  .drawer header .en{color:var(--muted);font-size:13px;font-style:italic;margin-top:1px;}
  .drawer header .sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .drawer .body{overflow-y:auto;padding:13px 15px 32px;}
  .xbtn{margin-left:auto;border:0;background:#eef2f6;border-radius:7px;width:30px;height:30px;font-size:17px;cursor:pointer;flex:0 0 auto;color:var(--muted);}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin:2px 0 12px;}
  .meta b{color:var(--muted);font-weight:600;}
  .chart{margin:0 0 20px;}
  .chart h3{font-size:13px;margin:0 0 2px;}
  .chart .cap{color:var(--muted);font-size:11.5px;margin:0 0 6px;}
  .keys{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:8px;}
  .key{display:flex;align-items:center;gap:5px;}
  .key i{width:11px;height:11px;border-radius:2px;display:inline-block;}
  .csvbtn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 12px;font:inherit;
    font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:14px;}
  .csvbtn:hover{filter:brightness(1.06);}
  .vfnote{background:#f3f0ff;border:1px solid #d9cff5;color:#4a3a7a;border-radius:8px;padding:8px 11px;font-size:12px;margin-bottom:12px;}
  .bulletin{white-space:pre-wrap;font-size:12.5px;line-height:1.55;}
  .btn-link{background:none;border:0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}
  .credit{font-size:11px;line-height:1.5;color:var(--muted);}
  .credit a{color:var(--accent);}
  .credit b{color:var(--fg);font-weight:600;}
  .loading{padding:40px;text-align:center;color:var(--muted);}
  .dam-label{background:rgba(255,255,255,.86);border:0;box-shadow:none;color:#16202b;font-size:11px;
    font-weight:600;padding:1px 5px;white-space:nowrap;}
  .dam-label::before{display:none;}
  .dam-label{display:none;}
  .leaflet-container.zlabels .dam-label{display:block;}
  @media (max-width:720px){.drawer{width:100vw;}.topleft{width:calc(100vw - 24px);}}
</style>
</head>
<body>
<div id="root"><div class="loading">Đang tải dữ liệu dự báo…</div></div>
<!-- shared logic (constants, helpers, Timeline, Credit, off-grid note) — one
     copy of dashboard-core.js per site folder, synced from web-shared/ -->
<script type="text/babel" data-presets="react" src="dashboard-core.js?v=1"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const { MODEL_COLOR, FIELDS, FIELD_ORDER, j, dmy, dm, dow, hhmm, num, norm,
  binsFor, colorFor, winTiles, stepTiles, Timeline, OffGridNote, Credit } = window.QPFShared;

/* ------------------------------------------------------------------ map */
function MapPane({legend,tmeta,admin,dams,model,field,frameIdx,markerValues,ver,onPick,focus}){
  const elRef=useRef(null),mapRef=useRef(null),rasterRef=useRef(null);
  const markersRef=useRef({}),selRef=useRef(null),boundRef=useRef(null);
  const bins = binsFor(field,legend);
  const idOf = useMemo(()=>{ const o={}; (markerValues?.ids||[]).forEach((id,i)=>o[id]=i); return o; },[markerValues]);

  useEffect(()=>{
    const map=L.map(elRef.current,{preferCanvas:true,zoomControl:false,minZoom:4,maxZoom:12}).setView([16.5,105.5],5);
    L.control.zoom({position:"topright"}).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
      {attribution:"Tiles &copy; Esri",maxZoom:16,maxNativeZoom:16}).addTo(map);
    map.createPane("raster"); map.getPane("raster").style.zIndex=200;
    map.createPane("admin"); map.getPane("admin").style.zIndex=400;
    map.getPane("admin").style.pointerEvents="none";
    map.createPane("bounds"); map.getPane("bounds").style.zIndex=350;
    map.createPane("labels"); map.getPane("labels").style.zIndex=655; map.getPane("labels").style.pointerEvents="none";
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:16,maxNativeZoom:16,pane:"labels"}).addTo(map);
    // Vietnamese island groups, labelled prominently like a major city
    [[16.5,112.0,"quần đảo Hoàng Sa<br>(Việt Nam)"],[9.7,113.8,"quần đảo Trường Sa<br>(Việt Nam)"]]
      .forEach(([la,lo,txt])=>L.marker([la,lo],{pane:"labels",interactive:false,
        icon:L.divIcon({className:"island-label",html:txt,iconSize:[150,34],iconAnchor:[75,17]})}).addTo(map));
    const applyZ=()=>{ const el=map.getContainer(); el.classList.toggle("zlabels",map.getZoom()>=9); };
    map.on("zoomend",applyZ); mapRef.current=map;
    return ()=>map.remove();
  },[]);

  // EXACT boundary vectors (province / neighbouring-country / Greater Mekong
  // basin) drawn with L.geoJSON on a non-interactive pane above the raster —
  // replaces the old basin.png image overlay, which could look geographically
  // shifted. Markers stay clickable (pane has pointer-events:none).
  const adminLayersRef=useRef([]);
  useEffect(()=>{ const map=mapRef.current; if(!map) return;
    adminLayersRef.current.forEach(l=>map.removeLayer(l)); adminLayersRef.current=[];
    const add=(gj,style)=>{ if(!gj) return;
      const l=L.geoJSON(gj,{pane:"admin",interactive:false,style:()=>style}).addTo(map);
      adminLayersRef.current.push(l); };
    add(admin.basin,{color:"#5a6b7d",weight:1.0,opacity:.55,fill:false});
    add(admin.adm1,{color:"#7a8896",weight:0.8,opacity:.5,fill:false});
    add(admin.tinh,{color:"#44525f",weight:1.0,opacity:.7,fill:false});
  },[admin]);

  // one raster path for EVERY source (ensembles + VForce-cast): a pre-rendered
  // PNG per source/field/frame over that source's own bounds
  useEffect(()=>{
    const map=mapRef.current; if(!map||!tmeta) return;
    const M=tmeta.models[model];
    if(!M||!M.fields.includes(field)){ if(rasterRef.current){map.removeLayer(rasterRef.current);rasterRef.current=null;} return; }
    const [s,w,n,e]=M.bounds; const b=[[s,w],[n,e]];
    const url=`tiles/${model}/${field}/${String(frameIdx).padStart(2,"0")}.png?v=${encodeURIComponent(ver)}`;
    if(!rasterRef.current) rasterRef.current=L.imageOverlay(url,b,{opacity:.74,pane:"raster",interactive:false}).addTo(map);
    else{ rasterRef.current.setUrl(url); rasterRef.current.setBounds(b); if(!map.hasLayer(rasterRef.current)) rasterRef.current.addTo(map); }
  },[tmeta,model,field,frameIdx,ver]);

  // markers, coloured from the small marker_values file (no grid on the client)
  useEffect(()=>{
    const map=mapRef.current; if(!map||!dams) return;
    if(!Object.keys(markersRef.current).length){
      dams.features.forEach(f=>{ const [lon,lat]=f.geometry.coordinates;
        const mk=L.circleMarker([lat,lon],{radius:5,weight:1.2,color:"#2a3542",fillColor:"#bcd",fillOpacity:.9});
        mk.on("click",()=>onPick(f.properties));
        mk.bindTooltip(f.properties.name,{permanent:true,direction:"top",className:"dam-label",offset:[0,-6]});
        mk.addTo(map); markersRef.current[f.properties.id]=mk; });
    }
    const mv = markerValues ? markerValues.models[model]?.[field] : null;
    const row = mv ? mv[frameIdx] : null;
    dams.features.forEach(f=>{ const id=f.properties.id; const mk=markersRef.current[id]; if(!mk) return;
      const di=idOf[id]; const v=(row&&di!=null)?row[di]:null;
      const col=colorFor(v,bins);
      mk.setStyle({fillColor:col||"#dfe6ee",fillOpacity:col?.95:.55,radius:5}); });
    if(selRef.current&&markersRef.current[selRef.current])
      markersRef.current[selRef.current].setStyle({radius:8,weight:2.4,color:"#12324d"}).bringToFront();
  },[dams,tmeta,model,field,frameIdx,bins,onPick,markerValues,idOf]);

  // focus: highlight + zoom to the (coarse) marker position. No boundary
  // overlay and no per-dam data fetch any more — detail lives on the linked
  // standalone page.
  useEffect(()=>{
    const map=mapRef.current; if(!map) return;
    if(selRef.current&&markersRef.current[selRef.current])
      markersRef.current[selRef.current].setStyle({radius:5,weight:1.2,color:"#2a3542"});
    selRef.current=focus?focus.id:null;
    if(boundRef.current){map.removeLayer(boundRef.current);boundRef.current=null;}
    if(focus&&markersRef.current[focus.id]){
      const mk=markersRef.current[focus.id];
      mk.setStyle({radius:8,weight:2.4,color:"#12324d"}).bringToFront();
      // A search result always flies to and zooms in on the dam (even when the
      // map is already zoomed in on somewhere else); a marker click only nudges
      // the zoom up if the map is still far out.
      if(focus.zoom) map.flyTo(mk.getLatLng(), Math.max(map.getZoom(), 11), {duration:.6});
      else if(map.getZoom()<9) map.setView(mk.getLatLng(), 9);
    }
  },[focus]);

  return <div id="map" ref={elRef} />;
}

/* ------------------------------------------------------------- detail */
// Clicking a dam no longer opens an in-app drawer: every dam has a
// standalone, self-contained page (charts, warning summary, CSV downloads)
// built by process_dam_html.py --public and published under dams/. This
// small card opens it in a new tab or downloads the file.
function DamCard({dam,onClose,ver}){
  const file=dam.page?dam.page.split("/").pop():"";
  // Cache-bust the link: the detail page is a SELF-CONTAINED html with this
  // run's forecast baked in, so without a version the browser happily serves
  // the previous run's copy from cache.
  const pageHref=dam.page?dam.page+"?v="+encodeURIComponent(ver||""):null;
  return <aside className="drawer" style={{width:360}}>
    <header>
      <div>
        <h2>{dam.name}</h2>
        {dam.name_en&&dam.name_en!==dam.name&&<div className="en">{dam.name_en}</div>}
        <div className="sub">{[dam.commune,dam.province].filter(Boolean).join(" · ")}</div>
      </div>
      <button className="xbtn" onClick={onClose} aria-label="Đóng">×</button>
    </header>
    <div className="body">
      {dam.page?<>
        <p className="hint" style={{fontSize:12.5,marginTop:0}}>
          Trang chi tiết của hồ/đập này gồm: tóm tắt cảnh báo, bản đồ ranh giới
          &amp; trường mưa theo ô lưới, chuỗi thời gian theo vùng, xác suất mưa
          lớn, biểu đồ hộp và tải CSV. Trang là một tệp HTML tự chứa — tải về
          vẫn mở được không cần mạng.</p>
        <a className="csvbtn" style={{display:"inline-block",textDecoration:"none",marginRight:8}}
          href={pageHref} target="_blank" rel="noopener">Mở trang chi tiết ↗</a>
        <a className="csvbtn" style={{display:"inline-block",textDecoration:"none",background:"#2a3542"}}
          href={pageHref} download={file}>⤓ Tải về (HTML)</a>
      </>:<p className="hint">Chưa có trang chi tiết cho hồ/đập này.</p>}
    </div>
  </aside>;
}

/* --------------------------------------------------------------- panels */
function Search({dams,onPick}){
  const [q,setQ]=useState("");
  const hits=useMemo(()=>{const t=norm(q.trim());if(t.length<2)return [];
    return dams.features.filter(f=>norm(f.properties.name).includes(t)||norm(f.properties.name_en).includes(t)).slice(0,40);},[q,dams]);
  return <div className="card searchbox">
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm tên hồ / đập…"/>
    {hits.length>0&&<div className="card results">
      {hits.map(f=><button key={f.properties.id} onClick={()=>{setQ("");onPick(f.properties,{zoom:true});}}>
        <div>{f.properties.name}</div>
        <div className="sub">{[f.properties.province,f.properties.country].filter(Boolean).join(" · ")}</div></button>)}
    </div>}
  </div>;
}
function Legend({legend,model,field,tile}){
  const isVf=model==="vforce"; const bins=binsFor(field,legend);
  const pref=isVf?"VForce-cast — ":"";
  return <div className="card pad">
    <p className="title" style={{marginBottom:2}}>{FIELDS[field].label}</p>
    <p className="hint" style={{marginTop:0,marginBottom:6}}>
      {pref+(field==="int"?"cường độ mưa mỗi bước — kịch bản điển hình Q50 (ô lưới thô)"
        :field==="cum"?"mưa cộng dồn từ giờ phát tin — kịch bản điển hình Q50 (ô lưới thô)"
        :field==="x50"?"tỉ lệ thành viên tổ hợp vượt 50 mm/24 giờ"
        :field==="q90"?"tổng mưa 24 giờ — kịch bản cực đoan (ô lưới thô)"
        :"tổng mưa 24 giờ — kịch bản điển hình (ô lưới thô)")}{tile?` · ${tile}`:""}</p>
    {bins.map((b,i)=><div className="legend-row" key={i}><span className="swatch" style={{background:b.color}}/><span>{b.label}</span></div>)}
    <p className="hint" style={{marginTop:6}}>Chấm tròn = hồ/đập, tô màu theo nguồn đang chọn.</p>
  </div>;
}
function Bulletin({bulletin,meta}){
  const [open,setOpen]=useState(false);
  const long=bulletin.text.length>180;
  const short=long?bulletin.text.slice(0,165).replace(/\s\S*$/,"")+" …":bulletin.text;
  return <div className="card pad">
    <p className="title">Nhận định bản tin</p>
    <div className="bulletin">{open||!long?bulletin.text:short}</div>
    {long&&<button className="btn-link" style={{marginTop:6}} onClick={()=>setOpen(!open)}>
      {open?"Thu gọn":"Xem đầy đủ"}</button>}
    <p className="hint" style={{marginTop:8}}>
      Phát tin {hhmm(meta.issued_ict||meta.init_ict)} ICT {dmy((meta.issued_ict||meta.init_ict).slice(0,10))}
      {bulletin.source==="gemini"?" · Nhận định tự động bởi AI Gemini":" · Nhận định tự động từ dữ liệu khí tượng"}</p>
  </div>;
}
/* ------------------------------------------------------------------ app */
function App(){
  const [meta,setMeta]=useState(null),[tmeta,setTmeta]=useState(null);
  const [dams,setDams]=useState(null),[markerValues,setMarkerValues]=useState(null);
  const [model,setModel]=useState("ensemble"),[field,setField]=useState("q50"),[idx,setIdx]=useState(0);
  // Phones: the panel covers the map, so start it collapsed there. Collapse
  // only when the viewport is KNOWN to be narrow — innerWidth can report 0
  // (hidden/not-yet-composited frame), and treating that as a phone would
  // start every desktop visit collapsed.
  const [panelOpen,setPanelOpen]=useState(()=>{
    const w=typeof window==="undefined"?0:window.innerWidth;
    return !(w>0&&w<=720);
  });
  const [playing,setPlaying]=useState(false),[focus,setFocus]=useState(null);
  const [bulletin,setBulletin]=useState(null),[admin,setAdmin]=useState({});

  useEffect(()=>{(async()=>{
    const m=await j("latest.json?t="+Date.now());
    const v="?v="+encodeURIComponent(m.created_utc);
    const [tm,d,mv]=await Promise.all([j("tiles/meta.json"+v),j("data/dams.geojson"+v),j("data/marker_values.json"+v)]);
    setMeta(m);setTmeta(tm);setDams(d);setMarkerValues(mv);
    fetch("bulletin.json"+v).then(r=>r.ok?r.json():null).then(b=>b&&setBulletin(b)).catch(()=>{});
    // exact boundary vectors (province / neighbouring-country / basin) — drawn
    // with L.geoJSON so they sit at true coordinates (the old basin.png raster
    // could look shifted)
    const A=m.admin||{};
    ["basin","adm1","tinh"].forEach(k=>A[k]&&j(A[k]+v)
      .then(g=>setAdmin(p=>({...p,[k]:g}))).catch(()=>{}));
  })().catch(e=>{document.getElementById("root").innerHTML='<div class="loading">Lỗi tải dữ liệu: '+e.message+'</div>';});},[]);

  const tiles=useMemo(()=>{ if(!meta||!tmeta) return [];
    const M=tmeta.models[model]; if(!M) return [];
    // 24-h windows: the SELECTED source's own axis. Steps: lead from the SAME
    // per-model anchor the windows use (M.anchor_ict = the issue snapped to
    // this model's step cadence) so a 6-hourly model reads +6/+12/... in line
    // with its +24/+48 windows, never the odd +3/+9/... a 3-hourly issue
    // produces. Fallbacks cover pre-update tiles files. Shared with dubaomua.
    if(FIELDS[field].kind==="win") return winTiles(M.windows);
    return stepTiles(M.steps, M.anchor_ict||tmeta.issued_ict||meta.issued_ict||meta.init_ict);
  },[meta,tmeta,model,field]);

  useEffect(()=>{if(idx>=tiles.length)setIdx(0);},[tiles.length]);
  useEffect(()=>{if(!playing||!tiles.length)return;const t=setInterval(()=>setIdx(i=>(i+1)%tiles.length),900);return ()=>clearInterval(t);},[playing,tiles.length]);

  // switching source keeps a valid field (VForce-cast has no x50)
  const selModel=(mid)=>{ setModel(mid); setIdx(0);
    const fs=tmeta.models[mid].fields;
    if(!fs.includes(field)) setField(fs.includes("q50")?"q50":fs[0]); };

  // Clicking a dam only highlights it and opens the link card — the detail
  // lives on the dam's standalone page under dams/ (no per-dam fetch here).
  // `zoom` is set from the search box so the map flies to the chosen dam;
  // a bare marker click leaves the current view. The timestamp makes every
  // pick a new object so re-selecting the same dam still re-triggers the fly.
  const pick=useCallback((props,opts)=>{
    setFocus({id:props.id, zoom:!!(opts&&opts.zoom), _t:Date.now()});
  },[]);

  if(!meta||!tmeta||!dams) return <div className="loading">Đang tải dữ liệu dự báo…</div>;
  const damProps=focus?(dams.features.find(f=>f.properties.id===focus.id)||{}).properties:null;
  const tile=tiles[idx]?`${tiles[idx].top} · ${tiles[idx].bot}`:"";
  const avail=tmeta.models[model].fields;
  const fieldSet=FIELD_ORDER.filter(k=>avail.includes(k)).map(k=>FIELDS[k]);

  return <>
    <MapPane legend={meta.legend} tmeta={tmeta} admin={admin} dams={dams} model={model} field={field}
      frameIdx={idx} markerValues={markerValues} ver={meta.created_utc} onPick={pick} focus={focus}/>

    <div className={"float topleft"+(panelOpen?"":" collapsed")}><div className={"stack"+(panelOpen?"":" collapsed")}>
      <div className="card brand">
        <button className="ptoggle" onClick={()=>setPanelOpen(o=>!o)}
          aria-expanded={panelOpen} title={panelOpen?"Thu gọn bảng điều khiển":"Mở bảng điều khiển"}
          aria-label={panelOpen?"Thu gọn bảng điều khiển":"Mở bảng điều khiển"}>{panelOpen?"\u2715":"\u2630"}</button>
        <h1>Dự báo mưa tổ hợp đến hồ đập</h1>
        <div className="sub">Việt Nam · phát tin
          {" "}{hhmm(meta.issued_ict||meta.init_ict)} ICT {dmy((meta.issued_ict||meta.init_ict).slice(0,10))}
          {" "}· bấm vào hồ/đập để mở trang chi tiết</div>
        <div className="sub" style={{marginTop:2,opacity:.75}}>
          {"Chu kỳ mô hình: "}
          {meta.models.filter(m=>m.init_ict||m.issue_ict).map(m=>
            `${m.short_vi} ${hhmm(m.init_ict||m.issue_ict)} ${dm(m.init_ict||m.issue_ict)}`).join(" · ")}
        </div>
      </div>
      <Search dams={dams} onPick={pick}/>
      <div className="card pad">
        <p className="lbl">Mô hình dự báo</p>
        <div className="seg mdl" style={{"--mc":MODEL_COLOR[model]}}>
          {meta.models.map(m=><button key={m.id} className={model===m.id?"on":""}
            style={model===m.id?{"--mc":MODEL_COLOR[m.id],"--mct":m.id==="ensemble"?"#3d3000":"#fff"}:{}} onClick={()=>selModel(m.id)}>{m.short_vi}</button>)}
        </div>
        <p className="lbl" style={{marginTop:12}}>Thông tin hiển thị</p>
        <div className="seg">
          {fieldSet.map(f=><button key={f.key} className={field===f.key?"on":""}
            onClick={()=>{setField(f.key);setIdx(0);}}>{f.label}</button>)}
        </div>
        <p className="hint" style={{marginTop:8}}>{meta.note}</p>
        <OffGridNote models={meta.models} model={model}/>
      </div>
      <Legend legend={meta.legend} model={model} field={field} tile={tile}/>
      {bulletin&&<Bulletin bulletin={bulletin} meta={meta}/>}
      <Credit/>
    </div></div>

    <Timeline tiles={tiles} idx={idx} setIdx={setIdx} playing={playing} setPlaying={setPlaying}/>

    {damProps&&<DamCard dam={damProps} ver={meta.created_utc} onClose={()=>setFocus(null)}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
